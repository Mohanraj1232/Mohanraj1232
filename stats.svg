<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" fill="none">
  <defs>
    <style>
      .card-bg { fill: #080a0c; }
      .card-border { stroke: rgba(255,255,255,0.06); stroke-width: 1; fill: none; }
      .section-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 10px;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.35);
      }
      .stat-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.45);
      }
      .stat-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .bar-bg { fill: rgba(255,255,255,0.04); }
      .bar-fill { fill: rgba(45,140,240,0.4); }
      .footer-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11px;
        fill: rgba(255,255,255,0.5);
        letter-spacing: 0.3px;
      }
      .divider { fill: rgba(255,255,255,0.04); }
    </style>
  </defs>

  <!-- Card background -->
  <rect class="card-bg" width="420" height="200"/>
  <rect class="card-border" x="0.5" y="0.5" width="419" height="199"/>

  <!-- Title -->
  <text class="section-title" x="24" y="30">GitHub Activity</text>

  <!-- Row 1: Repositories -->
  <text class="stat-label" x="24" y="60">Repositories</text>
  <text class="stat-value" x="24" y="86">40+</text>
  <rect class="bar-bg" x="124" y="74" width="85" height="3" rx="1"/>
  <rect class="bar-fill" x="124" y="74" width="60" height="3" rx="1"/>

  <!-- Row 2: Contributions -->
  <text class="stat-label" x="24" y="110">Contributions</text>
  <text class="stat-value" x="24" y="136">500+</text>
  <rect class="bar-bg" x="124" y="124" width="85" height="3" rx="1"/>
  <rect class="bar-fill" x="124" y="124" width="85" height="3" rx="1"/>

  <!-- Row 3: Stars -->
  <text class="stat-label" x="240" y="60">Stars</text>
  <text class="stat-value" x="240" y="86">15+</text>
  <rect class="bar-bg" x="320" y="74" width="75" height="3" rx="1"/>
  <rect class="bar-fill" x="320" y="74" width="40" height="3" rx="1"/>

  <!-- Row 4: Pull Requests -->
  <text class="stat-label" x="240" y="110">Pull Requests</text>
  <text class="stat-value" x="240" y="136">30+</text>
  <rect class="bar-bg" x="320" y="124" width="75" height="3" rx="1"/>
  <rect class="bar-fill" x="320" y="124" width="55" height="3" rx="1"/>

  <!-- Bottom divider -->
  <rect class="divider" x="24" y="155" width="372" height="1"/>

  <!-- Footer note -->
  <text class="footer-text" x="24" y="180">Committed to writing clean, efficient code every day.</text>
</svg>
