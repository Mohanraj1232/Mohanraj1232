<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 660" width="420" height="660" fill="none">
<defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>
  <linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1a1d21"/><stop offset="50%" stop-color="#2D8CF0"/><stop offset="100%" stop-color="#1a1d21"/>
  </linearGradient>
  <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0a0c0e"/><stop offset="100%" stop-color="#050607"/>
  </linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#c8ccd6"/><stop offset="45%" stop-color="#8a90a0"/><stop offset="55%" stop-color="#6a7080"/><stop offset="100%" stop-color="#9aa0b0"/>
  </linearGradient>
  <linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="420" height="660" fill="#050607"/>

<!-- Strap -->
<path d="M191 0 L229 0 L226 236 L194 236 Z" fill="url(#strapg)"/>
<line x1="196" y1="0" x2="198.5" y2="234" stroke="#fff" stroke-opacity=".15" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="224" y1="0" x2="221.5" y2="234" stroke="#fff" stroke-opacity=".15" stroke-width="1" stroke-dasharray="4 3"/>
<text x="218" y="14" font-size="8" font-weight="500" fill="#fff" opacity=".6" letter-spacing="3" writing-mode="tb">MOHANRAJ.DEV</text>

<!-- Clasp -->
<rect x="188" y="232" width="44" height="26" rx="4" fill="url(#metal)" stroke="#4a4f5c" stroke-width="1"/>
<rect x="199" y="238" width="22" height="7" rx="3.5" fill="#3c414e"/>

<!-- Ring -->
<circle cx="210" cy="272" r="14" fill="none" stroke="url(#metal)" stroke-width="5.5"/>

<!-- Card -->
<rect x="82" y="298" width="256" height="330" rx="2" fill="url(#cardg)" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

<!-- Card slot -->
<rect x="180" y="310" width="60" height="8" rx="4" fill="#080a0c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

<!-- Header band -->
<rect x="83" y="299" width="254" height="30" rx="1" fill="#080a0c" opacity=".9"/>
<text x="98" y="318" font-size="9" fill="rgba(255,255,255,0.35)" letter-spacing="3" font-weight="500">DEVELOPER ID</text>
<text x="322" y="318" text-anchor="end" font-size="9" fill="#2D8CF0" letter-spacing="2" font-weight="500">MG-1232</text>

<!-- Avatar circle -->
<circle cx="210" cy="400" r="55" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
<circle cx="210" cy="400" r="50" fill="#0e1013"/>
<text x="210" y="414" text-anchor="middle" font-size="34" font-weight="700" fill="#ffffff">MG</text>

<!-- Name -->
<text x="210" y="480" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Mohanraj G</text>

<!-- Title -->
<text x="210" y="505" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="2.5" font-weight="500">FULL STACK DEVELOPER</text>

<!-- Handle -->
<text x="210" y="527" text-anchor="middle" font-size="10.5" fill="rgba(255,255,255,0.35)">@Mohanraj1232</text>

<!-- Divider -->
<line x1="110" y1="545" x2="310" y2="545" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

<!-- Skill tags -->
<rect x="108" y="558" width="50" height="20" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="133" y="572" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)" letter-spacing="1" font-weight="500">REACT</text>

<rect x="166" y="558" width="50" height="20" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="191" y="572" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)" letter-spacing="1" font-weight="500">NODE</text>

<rect x="224" y="558" width="58" height="20" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="253" y="572" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)" letter-spacing="1" font-weight="500">FLUTTER</text>

<rect x="290" y="558" width="38" height="20" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<text x="309" y="572" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.6)" letter-spacing="1" font-weight="500">TS</text>

<!-- Barcode -->
<g>
  <rect x="108" y="590" width="2.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="113" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="117" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="120" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="124" y="590" width="4" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="129.5" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="134" y="590" width="4" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="139.5" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="142.5" y="590" width="4" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="149" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="153.5" y="590" width="2.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="158.5" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="162.5" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="166.5" y="590" width="2.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="171.5" y="590" width="2.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="175.5" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="180" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="184.5" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="189" y="590" width="1.5" height="22" fill="rgba(255,255,255,0.45)"/>
  <rect x="192" y="590" width="2.5" height="22" fill="rgba(255,255,255,0.45)"/>
</g>

<!-- Shine sweep (SMIL animation) -->
<rect x="-120" y="298" width="120" height="330" fill="url(#shineg)">
  <animate attributeName="x" values="-120;340" dur="4s" begin="1s" repeatCount="indefinite"/>
</rect>

<!-- Bottom text -->
<text x="210" y="645" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.3)">open to collaborate</text>
</svg>
