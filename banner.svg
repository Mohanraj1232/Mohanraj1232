<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" fill="none">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes lineGrow {
        from { width: 0; }
        to { width: 64px; }
      }
      @keyframes typewriter {
        0%, 100% { width: 0; }
        10%, 40% { width: 220px; }
        50%, 70% { width: 0; }
        80%, 95% { width: 180px; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes grainShift {
        0% { transform: translate(0, 0); }
        10% { transform: translate(-2px, -1px); }
        20% { transform: translate(1px, 2px); }
        30% { transform: translate(-1px, 0); }
        40% { transform: translate(2px, -2px); }
        50% { transform: translate(-2px, 1px); }
        60% { transform: translate(1px, -1px); }
        70% { transform: translate(0, 2px); }
        80% { transform: translate(-1px, -2px); }
        90% { transform: translate(2px, 0); }
        100% { transform: translate(0, 0); }
      }
      @keyframes subtleGlow {
        0%, 100% { opacity: 0.015; }
        50% { opacity: 0.035; }
      }
      .label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 10px;
        letter-spacing: 4px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.4);
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
      }
      .name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -1px;
        fill: #ffffff;
        opacity: 0;
        animation: fadeIn 0.8s ease 0.3s forwards;
      }
      .tagline {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        letter-spacing: 0.5px;
        fill: rgba(255,255,255,0.6);
        opacity: 0;
        animation: fadeIn 0.8s ease 0.9s forwards;
      }
      .divider {
        opacity: 0;
        animation: fadeIn 0.6s ease 0.6s forwards;
      }
      .typing-container {
        clip-path: inset(0 calc(100% - var(--tw)) 0 0);
      }
      .role-text {
        font-family: 'SF Mono', 'Fira Code', monospace;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.55);
      }
      .cursor {
        animation: blink 1s step-end infinite;
        fill: rgba(45,140,240,0.7);
      }
      .grain {
        animation: grainShift 0.5s steps(10) infinite;
      }
      .glow {
        animation: subtleGlow 4s ease-in-out infinite;
      }
      .border-line {
        stroke: rgba(255,255,255,0.06);
        stroke-width: 1;
      }
      .detail-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 3px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.35);
        opacity: 0;
        animation: fadeIn 0.6s ease 1.2s forwards;
      }
      .detail-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12px;
        fill: rgba(255,255,255,0.7);
        opacity: 0;
        animation: fadeIn 0.6s ease 1.3s forwards;
      }
    </style>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="overlay"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#050607"/>

  <!-- Subtle grain overlay -->
  <rect class="grain" width="900" height="400" filter="url(#noise)" opacity="0.03"/>

  <!-- Subtle blue glow -->
  <ellipse class="glow" cx="450" cy="200" rx="250" ry="150" fill="#2D8CF0" opacity="0.02"/>

  <!-- Border frame -->
  <rect x="24" y="24" width="852" height="352" rx="0" class="border-line" fill="none"/>

  <!-- Top label -->
  <text class="label" x="60" y="80">Software Developer</text>

  <!-- Name -->
  <text class="name" x="60" y="160">Mohanraj G</text>

  <!-- Divider line -->
  <rect class="divider" x="60" y="185" width="64" height="1" fill="rgba(255,255,255,0.4)"/>

  <!-- Tagline -->
  <text class="tagline" x="60" y="220">Building thoughtful digital experiences and practical solutions.</text>

  <!-- Typing role animation -->
  <g opacity="0" style="animation: fadeIn 0.6s ease 1.1s forwards;">
    <rect x="60" y="248" width="2" height="16" class="cursor"/>
    <!-- Role 1 -->
    <g>
      <clipPath id="clip1">
        <rect x="68" y="235" width="0" height="22">
          <animate attributeName="width" values="0;200;200;200;0;0;0;0" keyTimes="0;0.1;0.35;0.4;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
      <text class="role-text" x="68" y="262" clip-path="url(#clip1)">Full Stack Developer</text>
    </g>
    <!-- Role 2 -->
    <g>
      <clipPath id="clip2">
        <rect x="68" y="235" width="0" height="22">
          <animate attributeName="width" values="0;0;0;0;0;180;180;180;0;0" keyTimes="0;0.44;0.45;0.48;0.5;0.6;0.85;0.9;0.95;1" dur="8s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
      <text class="role-text" x="68" y="262" clip-path="url(#clip2)">Problem Solver</text>
    </g>
  </g>

  <!-- Bottom details -->
  <g>
    <text class="detail-label" x="60" y="340">Location</text>
    <text class="detail-value" x="60" y="358">India</text>
  </g>
  <g>
    <text class="detail-label" x="200" y="340">Focus</text>
    <text class="detail-value" x="200" y="358">Web &amp; Mobile</text>
  </g>
  <g>
    <text class="detail-label" x="360" y="340">Status</text>
    <text class="detail-value" x="360" y="358">Open to Collaborate</text>
  </g>

  <!-- Corner accent -->
  <rect x="836" y="40" width="24" height="1" fill="rgba(45,140,240,0.3)" opacity="0" style="animation: fadeIn 0.6s ease 1.5s forwards;"/>
  <rect x="859" y="40" width="1" height="24" fill="rgba(45,140,240,0.3)" opacity="0" style="animation: fadeIn 0.6s ease 1.5s forwards;"/>
</svg>
