<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" fill="none">
<defs>
<style type="text/css"><![CDATA[
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
@keyframes settle{0%{transform:rotate(0deg) translateY(-480px)}18%{transform:rotate(0deg) translateY(0)}30%{transform:rotate(11deg)}46%{transform:rotate(-7deg)}62%{transform:rotate(5deg)}78%{transform:rotate(-3deg)}92%{transform:rotate(1.2deg)}100%{transform:rotate(0deg)}}
@keyframes sway{0%,100%{transform:rotate(-2.8deg)}50%{transform:rotate(2.8deg)}}
@keyframes cardWobble{0%,100%{transform:rotate(1.4deg)}50%{transform:rotate(-1.4deg)}}
@keyframes shine{0%{transform:translateX(-200px) skewX(-18deg)}55%,100%{transform:translateX(300px) skewX(-18deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.settle{transform-origin:155px 4px;animation:settle 3.4s cubic-bezier(.34,1.1,.5,1) forwards}
.sway{transform-origin:155px 4px;animation:sway 4.2s ease-in-out 3.4s infinite}
.wob{transform-origin:155px 220px;animation:cardWobble 4.2s ease-in-out 3.4s infinite}
.shine{animation:shine 4.5s ease-in-out 3.6s infinite}
]]></style>
<linearGradient id="strapg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#1a1d21"/><stop offset="50%" stop-color="#2D8CF0"/><stop offset="100%" stop-color="#1a1d21"/>
</linearGradient>
<linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0a0c0e"/><stop offset="100%" stop-color="#050607"/>
</linearGradient>
<linearGradient id="cardborder" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%"><animate attributeName="stop-color" values="rgba(255,255,255,0.1);rgba(45,140,240,0.3);rgba(255,255,255,0.1)" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="rgba(45,140,240,0.3);rgba(255,255,255,0.1);rgba(45,140,240,0.3)" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#c8ccd6"/><stop offset="45%" stop-color="#8a90a0"/><stop offset="55%" stop-color="#6a7080"/><stop offset="100%" stop-color="#9aa0b0"/>
</linearGradient>
<linearGradient id="shineg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="cardclip"><rect x="62" y="218" width="186" height="240" rx="2"/></clipPath>
</defs>

<!-- Background -->
<rect width="900" height="480" fill="#050607"/>
<rect x="0.5" y="0.5" width="899" height="479" rx="0" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

<!-- ===== LEFT: LANYARD ===== -->
<g class="settle"><g class="sway">

  <!-- Strap -->
  <path d="M141 -4 L169 -4 L167 172 L143 172 Z" fill="url(#strapg)"/>
  <line x1="145" y1="0" x2="146" y2="170" stroke="#fff" stroke-opacity=".15" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="165" y1="0" x2="164" y2="170" stroke="#fff" stroke-opacity=".15" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="160" y="10" font-size="7" font-weight="500" fill="#fff" opacity=".6" letter-spacing="2.5" writing-mode="tb">MOHANRAJ.DEV</text>

  <!-- Clasp -->
  <rect x="138" y="170" width="34" height="20" rx="3" fill="url(#metal)" stroke="#4a4f5c" stroke-width="1"/>
  <rect x="147" y="174" width="16" height="5" rx="2.5" fill="#3c414e"/>

  <!-- Ring -->
  <circle cx="155" cy="200" r="10" fill="none" stroke="url(#metal)" stroke-width="4"/>

  <!-- Card -->
  <g class="wob">
    <rect x="62" y="218" width="186" height="240" rx="2" fill="url(#cardg)" stroke="url(#cardborder)" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Slot -->
    <rect x="130" y="226" width="44" height="6" rx="3" fill="#080a0c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <g clip-path="url(#cardclip)">
      <!-- Header band -->
      <rect x="62" y="218" width="186" height="24" fill="#080a0c" opacity=".9"/>
      <text x="74" y="234" font-size="7" fill="rgba(255,255,255,0.35)" letter-spacing="2.5" font-weight="500">DEVELOPER ID</text>
      <text x="236" y="234" text-anchor="end" font-size="7" fill="#2D8CF0" letter-spacing="1.5" font-weight="500">MG-1232</text>

      <!-- Avatar -->
      <circle cx="155" cy="296" r="38" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
      <circle cx="155" cy="296" r="34" fill="#0e1013"/>
      <text x="155" y="306" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">MG</text>

      <!-- Name -->
      <text x="155" y="354" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Mohanraj G</text>

      <!-- Title -->
      <text x="155" y="374" text-anchor="middle" font-size="8.5" fill="rgba(255,255,255,0.5)" letter-spacing="2" font-weight="500">FULL STACK DEVELOPER</text>

      <!-- Handle -->
      <text x="155" y="392" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.35)">@Mohanraj1232</text>

      <!-- Divider -->
      <line x1="80" y1="404" x2="230" y2="404" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

      <!-- Skills -->
      <rect x="76" y="412" width="38" height="15" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="95" y="423" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.8">REACT</text>

      <rect x="119" y="412" width="36" height="15" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="137" y="423" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.8">NODE</text>

