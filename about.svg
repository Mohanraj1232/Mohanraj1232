<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" fill="none">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .about-bg { fill: #080a0c; }
      .about-border { stroke: rgba(255,255,255,0.06); stroke-width: 1; fill: none; }
      .section-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.4);
      }
      .bio-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13.5px;
        fill: rgba(255,255,255,0.7);
        line-height: 1.7;
      }
      .detail-key {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 10px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.35);
      }
      .detail-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12.5px;
        fill: rgba(255,255,255,0.75);
      }
      .link-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.5);
      }
      .link-border { stroke: rgba(255,255,255,0.12); stroke-width: 1; fill: none; }
      .divider { fill: rgba(255,255,255,0.06); }
      .row { opacity: 0; animation: fadeIn 0.5s ease forwards; }
      .r1 { animation-delay: 0.1s; }
      .r2 { animation-delay: 0.2s; }
      .r3 { animation-delay: 0.3s; }
      .r4 { animation-delay: 0.4s; }
      .r5 { animation-delay: 0.5s; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="about-bg" width="900" height="220"/>
  <rect class="about-border" x="0.5" y="0.5" width="899" height="219"/>

  <!-- Section label -->
  <text class="section-label row r1" x="32" y="30">About</text>

  <!-- Bio text -->
  <text class="bio-text row r2" x="32" y="60">Computer Science student and software developer passionate about building</text>
  <text class="bio-text row r2" x="32" y="80">practical solutions, solving problems, and turning ideas into meaningful digital experiences.</text>

  <!-- Separator -->
  <rect class="divider row r3" x="32" y="100" width="836" height="1"/>

  <!-- Details row -->
  <g class="row r4" transform="translate(32, 120)">
    <text class="detail-key" x="0" y="10">Currently</text>
    <text class="detail-val" x="0" y="30">Building full-stack web applications</text>
  </g>
  <g class="row r4" transform="translate(320, 120)">
    <text class="detail-key" x="0" y="10">Learning</text>
    <text class="detail-val" x="0" y="30">System Design &amp; Cloud Architecture</text>
  </g>
  <g class="row r4" transform="translate(620, 120)">
    <text class="detail-key" x="0" y="10">Focus</text>
    <text class="detail-val" x="0" y="30">Clean code &amp; efficient solutions</text>
  </g>

  <!-- Separator -->
  <rect class="divider row r5" x="32" y="170" width="836" height="1"/>

  <!-- Links -->
  <g class="row r5" transform="translate(32, 185)">
    <rect class="link-border" x="0" y="0" width="90" height="26" rx="0"/>
    <text class="link-text" x="14" y="17">Portfolio</text>

    <rect class="link-border" x="110" y="0" width="86" height="26" rx="0"/>
    <text class="link-text" x="124" y="17">LinkedIn</text>

    <rect class="link-border" x="216" y="0" width="68" height="26" rx="0"/>
    <text class="link-text" x="232" y="17">Email</text>

    <rect class="link-border" x="304" y="0" width="90" height="26" rx="0"/>
    <text class="link-text" x="318" y="17">LeetCode</text>
  </g>
</svg>
