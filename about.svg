<circle cx="455" cy="274" r="3" fill="rgba(45,140,240,0.5)"/><text x="464" y="278" font-size="11.5" letter-spacing="1" fill="rgba(255,255,255,0.7)">TypeScript</text>
<circle cx="565" cy="274" r="3" fill="rgba(45,140,240,0.5)"/><text x="574" y="278" font-size="11.5" letter-spacing="1" fill="rgba(255,255,255,0.7)">Python</text>
<circle cx="650" cy="274" r="3" fill="rgba(45,140,240,0.5)"/><text x="659" y="278" font-size="11.5" letter-spacing="1" fill="rgba(255,255,255,0.7)">Java</text>
<circle cx="715" cy="274" r="3" fill="rgba(45,140,240,0.5)"/><text x="724" y="278" font-size="11.5" letter-spacing="1" fill="rgba(255,255,255,0.7)">Dart</text>
