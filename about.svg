      <text x="182" y="423" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.8">FLUTTER</text>

      <rect x="209" y="412" width="28" height="15" rx="1" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="223" y="423" text-anchor="middle" font-size="6.5" fill="rgba(255,255,255,0.6)" letter-spacing="0.8">TS</text>

      <!-- Barcode -->
      <rect x="76" y="435" width="2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="80" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="83" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="85.5" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="88.5" y="435" width="3" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="93" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="96" y="435" width="3" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="100.5" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="103" y="435" width="3" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="108" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="111" y="435" width="2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="115" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="118" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="121" y="435" width="2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="125" y="435" width="2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="129" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="132" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="135.5" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="139" y="435" width="1.2" height="16" fill="rgba(255,255,255,0.45)"/>
      <rect x="142" y="435" width="2" height="16" fill="rgba(255,255,255,0.45)"/>

      <!-- Shine sweep -->
      <rect class="shine" x="62" y="218" width="80" height="260" fill="url(#shineg)"/>
    </g>
  </g>
</g></g>

<!-- Bottom text under lanyard -->
<text x="155" y="472" text-anchor="middle" font-size="8" fill="rgba(255,255,255,0.25)" opacity="0" style="animation:fadeIn .6s ease 3.6s forwards">open to collaborate</text>

