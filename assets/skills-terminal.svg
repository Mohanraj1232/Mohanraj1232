<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220">
  <defs>
    <style>
      .term-bg { fill: #161b22; }
      .term-chrome { fill: #21262d; }
      .term-border { fill: none; stroke: #30363d; stroke-width: 1; }
      .term-title { fill: #8b949e; font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 12px; }
      .cmd { fill: #e6edf3; font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
      .key { fill: #58A6FF; font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; }
      .val { fill: #3FB950; font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; }
      .brace { fill: #e6edf3; font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 13px; }
      .prompt { fill: #3FB950; font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; }
      @media (prefers-color-scheme: light) {
        .term-bg { fill: #f6f8fa; }
        .term-chrome { fill: #e8ebef; }
        .term-border { stroke: #d0d7de; }
        .term-title { fill: #656d76; }
        .cmd { fill: #1f2328; }
        .key { fill: #0969da; }
        .val { fill: #1a7f37; }
        .brace { fill: #1f2328; }
        .prompt { fill: #1a7f37; }
      }
    </style>
  </defs>

  <!-- Terminal window -->
  <rect class="term-bg" x="0.5" y="0.5" width="839" height="219" rx="10"/>
  <rect class="term-border" x="0.5" y="0.5" width="839" height="219" rx="10"/>

  <!-- Chrome bar -->
  <rect class="term-chrome" x="1" y="1" width="838" height="32" rx="10"/>
  <rect class="term-bg" x="1" y="23" width="838" height="10"/>
  <circle cx="20" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="40" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="60" cy="17" r="6" fill="#27C93F"/>
  <text class="term-title" x="420" y="21" text-anchor="middle">~/.config/skills.json</text>

  <!-- Command -->
  <text class="prompt" x="24" y="58">$</text>
  <text class="cmd" x="40" y="58">cat skills.json | jq</text>

  <!-- JSON output -->
  <text class="brace" x="24" y="82">{</text>

  <text class="key" x="44" y="104">"mobile"</text>
  <text class="brace" x="116" y="104">:</text>
  <text class="val" x="132" y="104">["Flutter", "Dart", "Kotlin", "Android SDK", "Java"]</text>

  <text class="key" x="44" y="128">"backend"</text>
  <text class="brace" x="124" y="128">:</text>
  <text class="val" x="132" y="128">["Python", "Java", "SQL", "Firebase"]</text>

  <text class="key" x="44" y="152">"devops"</text>
  <text class="brace" x="116" y="152">:</text>
  <text class="val" x="132" y="152">["Docker", "Terraform", "Jenkins", "Git", "Maven"]</text>

  <text class="key" x="44" y="176">"web"</text>
  <text class="brace" x="92" y="176">:</text>
  <text class="val" x="132" y="176">["JavaScript", "HTML/CSS", "TypeScript"]</text>

  <text class="brace" x="24" y="200">}</text>
</svg>
