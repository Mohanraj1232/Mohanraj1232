<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" fill="none">
  <defs>
    <style>
      .bg { fill: #050607; }
      .frame { stroke: rgba(255,255,255,0.06); stroke-width: 1; fill: none; }
      .section-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.4);
      }
      .cat-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.3);
      }
      .tech {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11.5px;
        letter-spacing: 1px;
        fill: rgba(255,255,255,0.7);
      }
      .dot { fill: rgba(45,140,240,0.5); }
      .sep { fill: rgba(255,255,255,0.06); }
    </style>
  </defs>

  <rect class="bg" width="900" height="170"/>
  <rect class="frame" x="0.5" y="0.5" width="899" height="169"/>

  <!-- Title -->
  <text class="section-label" x="32" y="28">Tech Stack</text>

  <!-- Languages label -->
  <text class="cat-label" x="32" y="58">Languages</text>

  <!-- Language items -->
  <circle class="dot" cx="37" cy="79" r="3"/><text class="tech" x="46" y="83">JavaScript</text>
  <circle class="dot" cx="145" cy="79" r="3"/><text class="tech" x="154" y="83">TypeScript</text>
  <circle class="dot" cx="255" cy="79" r="3"/><text class="tech" x="264" y="83">Python</text>
  <circle class="dot" cx="335" cy="79" r="3"/><text class="tech" x="344" y="83">Java</text>
  <circle class="dot" cx="400" cy="79" r="3"/><text class="tech" x="409" y="83">Dart</text>
  <circle class="dot" cx="460" cy="79" r="3"/><text class="tech" x="469" y="83">C++</text>

  <!-- Vertical separator -->
  <rect class="sep" x="555" y="48" width="1" height="105"/>

  <!-- Frameworks label -->
  <text class="cat-label" x="585" y="58">Frameworks</text>

  <!-- Framework items -->
  <circle class="dot" cx="590" cy="79" r="3"/><text class="tech" x="599" y="83">React / Next.js</text>
  <circle class="dot" cx="735" cy="79" r="3"/><text class="tech" x="744" y="83">Node.js</text>
  <circle class="dot" cx="590" cy="107" r="3"/><text class="tech" x="599" y="111">Flutter</text>
  <circle class="dot" cx="735" cy="107" r="3"/><text class="tech" x="744" y="111">Express</text>

  <!-- Tools label -->
  <text class="cat-label" x="32" y="115">Tools</text>

  <!-- Tool items -->
  <circle class="dot" cx="37" cy="137" r="3"/><text class="tech" x="46" y="141">Git</text>
  <circle class="dot" cx="100" cy="137" r="3"/><text class="tech" x="109" y="141">Docker</text>
  <circle class="dot" cx="190" cy="137" r="3"/><text class="tech" x="199" y="141">MongoDB</text>
  <circle class="dot" cx="295" cy="137" r="3"/><text class="tech" x="304" y="141">PostgreSQL</text>
  <circle class="dot" cx="415" cy="137" r="3"/><text class="tech" x="424" y="141">Firebase</text>
</svg>
