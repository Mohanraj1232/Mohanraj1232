<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" fill="none">
  <defs>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .bg { fill: #050607; }
      .frame { stroke: rgba(255,255,255,0.06); stroke-width: 1; fill: none; }
      .section-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 3.5px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.4);
      }
      .cat-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 9px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        fill: rgba(255,255,255,0.3);
      }
      .tech {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 11.5px;
        letter-spacing: 1px;
        fill: rgba(255,255,255,0.7);
      }
      .dot { fill: rgba(45,140,240,0.5); }
      .sep { fill: rgba(255,255,255,0.06); }
      .item { opacity: 0; animation: fadeIn 0.4s ease forwards; }
    </style>
  </defs>

  <rect class="bg" width="900" height="170"/>
  <rect class="frame" x="0.5" y="0.5" width="899" height="169"/>

  <!-- Title -->
  <text class="section-label" x="32" y="28">Tech Stack</text>

  <!-- Languages -->
  <text class="cat-label" x="32" y="60">Languages</text>
  <g class="item" style="animation-delay:0.1s" transform="translate(32, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">JavaScript</text>
  </g>
  <g class="item" style="animation-delay:0.15s" transform="translate(140, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">TypeScript</text>
  </g>
  <g class="item" style="animation-delay:0.2s" transform="translate(250, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Python</text>
  </g>
  <g class="item" style="animation-delay:0.25s" transform="translate(330, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Java</text>
  </g>
  <g class="item" style="animation-delay:0.3s" transform="translate(395, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Dart</text>
  </g>
  <g class="item" style="animation-delay:0.35s" transform="translate(455, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">C++</text>
  </g>

  <!-- Vertical separator -->
  <rect class="sep" x="555" y="50" width="1" height="100"/>

  <!-- Frameworks -->
  <text class="cat-label" x="585" y="60">Frameworks</text>
  <g class="item" style="animation-delay:0.4s" transform="translate(585, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">React / Next.js</text>
  </g>
  <g class="item" style="animation-delay:0.45s" transform="translate(730, 72)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Node.js</text>
  </g>
  <g class="item" style="animation-delay:0.5s" transform="translate(585, 98)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Flutter</text>
  </g>
  <g class="item" style="animation-delay:0.55s" transform="translate(730, 98)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Express</text>
  </g>

  <!-- Tools -->
  <text class="cat-label" x="32" y="115">Tools</text>
  <g class="item" style="animation-delay:0.6s" transform="translate(32, 127)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Git</text>
  </g>
  <g class="item" style="animation-delay:0.65s" transform="translate(95, 127)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Docker</text>
  </g>
  <g class="item" style="animation-delay:0.7s" transform="translate(185, 127)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">MongoDB</text>
  </g>
  <g class="item" style="animation-delay:0.75s" transform="translate(290, 127)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">PostgreSQL</text>
  </g>
  <g class="item" style="animation-delay:0.8s" transform="translate(410, 127)">
    <circle class="dot" cx="5" cy="9" r="3"/><text class="tech" x="14" y="13">Firebase</text>
  </g>
</svg>
